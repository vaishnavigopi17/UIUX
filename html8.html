<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>IMAGE SLIDER</title>
</head>
<body>
    <h2> Image slider</h2>
    <img id="image" src="images1.jpg">
    <br>
    <button onclick="previous()">previous</body></button>
    <button onclick="next()">Next</button>
    <script>
        let images=["images1.jpg","images2.jpg","images3.jpg","images4.jpg",];
        let i=0;
        function next(){
            i++;
            if(i==images.length){
                i=0;
            }
            document.getElementById("image").src=images[i];
        }
        function previous(){
            i--;
            if(i<0){
                i=images.length-1;
            }
            document.getElementById("image").src=images[i];
        }
        setInterval(next,3000);
    </script>
</body>
</html>
